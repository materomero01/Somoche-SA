<div class="modal-content tables">
    <div id="tercerosClienteContent">
        <span class="close-button" id="closeBtnTerceros">&times;</span>
        <div class="modal-header-content" style="margin-bottom: 50px; justify-content: space-between;">
            <div style="gap: 10px; align-items: center;">
                <div class="tab-selector" id="chequesClienteSelector">
                    <div class="tab-item active" data-tab="proximos">Próximos</div>
                    <div class="tab-item" data-tab="pagos">Pagos</div>
                    <div class="tab-indicator"></div>
                </div>
            </div>
            <h2 id="headerModal" style="margin-bottom: 30px;">Cheques Cliente</h2>
            <div style="align-items: center;">
                <div class="person-info" style="margin-right: 20px;">
                    <i class="bi bi-buildings"></i>
                    <span>Nombre del Cliente</span>
                </div>
                <span id="total-cheques-proximos-cliente" class="total-cheques" style="margin-bottom: 10px; margin-right: 20px;">Total: $0.00</span>
            </div>
        </div>
        <div class="table-header-with-button">
            <div id="cheques-cliente-selection-controls" class="hidden" style="margin-top: 0px;">
                <div class="cheques-selected-summary" style="margin-bottom: 0px;">
                    <span>Cheques seleccionados: <span id="selected-cheques-cliente-count">0</span></span>
                    <span>Total a pagar: $<span id="selected-cheques-cliente-total">0.00</span></span>
                </div>
            </div>
            <div class="filter-buttons-container" style="margin-bottom: 15px; justify-content: flex-end;">
                <button id="clear-filter-btn-cheques-cliente" class="btn btn-danger btn-sm ms-2 hidden"><i
                    class="bi bi-x-lg"></i></button>
                <button id="filter-btn-cheques-cliente" class="btn btn-success"><i class="bi bi-funnel"></i> Filtrar</button>
            </div>
        </div>
        <div id="tabla-cheques-cliente" class="tabla-dinamica"></div>
        <div id="paginacion-cheques-cliente" class="pagination-controls"></div>
    </div>
</div>
